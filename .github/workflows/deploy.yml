name: Build and deploy

# GitHub → Actions → Next.js static export → Cloudflare Pages → uiux.abud.fun
#
# Pull requests build and are checked but are not published. Pushes to `main`
# publish the export to the production branch of the Pages project.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # `output: "export"` in next.config.ts — this writes out/.
      - name: Build static export
        run: npm run build

      - name: Verify export
        run: |
          test -f out/index.html
          test -f out/404.html
          for world in nova atelier pulse vault orbit forma luma signal object mercato; do
            test -f "out/worlds/$world.html" || { echo "missing world: $world"; exit 1; }
          done
          echo "11 routes exported."

      # Until CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are set on the
      # repository, the pipeline still builds and verifies every push and only
      # the publish is skipped — so a missing account reads as "not wired yet"
      # rather than as a broken build.
      - name: Check for Cloudflare credentials
        id: cf
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare secrets are not set — skipping publish. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to deploy."
          fi

      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request' && steps.cf.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=abud-uiux --branch=main
